name: Publish MCP server

on:
  release:
    types: [published]

permissions:
  contents: read
  # Needed for npm trusted publishing (OIDC). No long living NPM_TOKEN has to be stored.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Read and validate the version from the tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "The tag does not contain a valid semver version: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Install
        run: npm ci
      # The MCP server is bundled, so the registry artifact has no dependencies. The build
      # version is the release tag, exactly like `initialize` reports it.
      - name: Compile MCP server
        env:
          BUILD_VERSION: ${{ env.VERSION }}
        run: npm run compile:mcp
      - name: Test MCP server
        env:
          BUILD_VERSION: ${{ env.VERSION }}
        run: npm run test:mcp
      - name: Set the package version and copy the bundle
        run: |
          npm version "$VERSION" --no-git-tag-version --prefix mcp
          mkdir -p mcp/dist
          cp dist/mcp-server.js mcp/dist/mcp-server.js
      - name: Publish to npm
        run: |
          if printf '%s' "$VERSION" | grep -q '-'; then
            npm publish ./mcp --access public --provenance --tag next
          else
            npm publish ./mcp --access public --provenance
          fi
